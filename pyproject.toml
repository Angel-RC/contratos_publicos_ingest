[project]
name = "contratos-publicos-ingest"
version = "0.1.0"
description = "Ingesta con dlt de licitaciones públicas nacionales (PLACSP)"
readme = "README.md"
authors = [
    { name = "Angel RC", email = "angel.r.chicote@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
