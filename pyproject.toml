[project]
name = "contratos-publicos-ingest"
version = "0.1.0"
description = "Ingesta con dlt de licitaciones públicas nacionales (PLACSP)"
readme = "README.md"
authors = [
    { name = "Angel RC", email = "angel.r.chicote@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dlt[duckdb]>=1.30.0",
    "requests>=2.34.2",
]

[project.scripts]
contratos-publicos-ingest = "contratos_publicos_ingest:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
